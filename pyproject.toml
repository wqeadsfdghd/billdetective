[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billdetective"
version = "0.1.0"
description = "本地账单侦探：在你自己电脑上找出偷偷流走的钱——隐形订阅、自动续费、消费结构。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wqeadsfdghd" }]
keywords = ["bill", "expense", "subscription", "alipay", "wechat", "privacy", "personal-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]

# Intentionally empty: the whole point is that `git clone` + `python -m billdetective`
# works with no install step and no network access.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
billdetective = "billdetective.cli:main"

[project.urls]
Homepage = "https://github.com/wqeadsfdghd/billdetective"
Issues = "https://github.com/wqeadsfdghd/billdetective/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
